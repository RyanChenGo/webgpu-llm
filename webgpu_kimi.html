<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimi K3 & K3 Pro (2.6T 本地版) - 浏览器本地运行 · 隐私 · 极简</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .prose pre {
      background-color: #0f172a !important;
      border: 1px solid #1e293b;
      border-radius: 0.5rem;
      padding: 0.875rem;
      margin: 0.75rem 0;
      overflow-x: auto;
      position: relative;
    }
    .prose code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875em; }
    .prose p { margin-bottom: 0.65rem; line-height: 1.65; }
    .prose p:last-child { margin-bottom: 0; }
    .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.65rem; list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
    .copy-btn {
      position: absolute; top: 0.4rem; right: 0.4rem;
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
      border-radius: 0.375rem; padding: 0.2rem 0.5rem; font-size: 0.75rem;
      cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { background: #334155; color: #f8fafc; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-fuchsia-500/30">

  <!-- 顶部状态栏 -->
  <header class="border-b border-slate-800/80 bg-slate-900/70 backdrop-blur-md sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-fuchsia-500 to-rose-600 flex items-center justify-center font-bold text-white shadow-lg shadow-fuchsia-500/20">
          K3
        </div>
        <div>
          <h1 class="text-base font-semibold tracking-tight text-slate-100 flex items-center gap-2">
            Kimi K3 & K3 Pro
            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20">2.6T 纯本地</span>
          </h1>
          <p class="text-xs text-slate-400">100% 本地前端引擎 · 无 API · 隐私安全</p>
        </div>
      </div>

      <!-- 本地硬件与性能指标 -->
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <div id="gpu-badge" class="px-2.5 py-1 rounded-md bg-slate-800/90 border border-slate-700/80 text-slate-300 flex items-center gap-1.5">
          <span id="gpu-dot" class="w-2 h-2 rounded-full bg-fuchsia-400 animate-pulse"></span>
          <span id="gpu-text">检测本地硬件中...</span>
        </div>
        <div class="px-2.5 py-1 rounded-md bg-slate-800/90 border border-slate-700/80 text-slate-300">
          TTFT: <span id="stat-ttft" class="font-mono text-fuchsia-400">--</span>
        </div>
        <div class="px-2.5 py-1 rounded-md bg-slate-800/90 border border-slate-700/80 text-slate-300">
          速度: <span id="stat-tps" class="font-mono text-fuchsia-400">--</span> tok/s
        </div>
      </div>
    </div>
  </header>

  <!-- 控制面板 -->
  <section class="border-b border-slate-800/60 bg-slate-900/40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col gap-3">
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 flex-1">
          <label for="model-select" class="text-xs font-medium text-slate-400 whitespace-nowrap">本地模型：</label>
          <select id="model-select" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-fuchsia-500 transition">
            <option value="Kimi K3" selected>Kimi K3（2.6T 参数 · 本地空跑测试引擎）</option>
            <option value="Kimi K3 Pro">Kimi K3 Pro（2.6T 参数 · 本地空跑测试引擎）</option>
          </select>

          <button id="load-btn" class="px-4 py-2 rounded-lg bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs font-medium transition shadow-sm shadow-fuchsia-600/20 whitespace-nowrap">
            挂载本地权重
          </button>
        </div>

        <div class="flex items-center gap-2 justify-end">
          <button id="clear-chat-btn" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition border border-slate-700/70">
            清空对话
          </button>
        </div>
      </div>

      <!-- 进度条 -->
      <div id="progress-container" class="hidden">
        <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-3">
          <div class="flex items-center justify-between text-xs mb-1.5">
            <span id="progress-text" class="text-slate-300 truncate pr-2">扫描本地 2.6T 分片中...</span>
            <span id="progress-pct" class="font-mono text-fuchsia-400 font-semibold">0%</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
            <div id="progress-bar" class="bg-fuchsia-500 h-1.5 rounded-full transition-all duration-150" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 聊天消息区 -->
  <main id="chat-container" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 overflow-y-auto space-y-5">
    <div id="welcome-card" class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 text-center max-w-xl mx-auto my-8">
      <div class="w-12 h-12 rounded-2xl bg-fuchsia-500/10 border border-fuchsia-500/20 text-fuchsia-400 flex items-center justify-center mx-auto mb-3 text-xl font-bold">
        2.6T
      </div>
      <h2 class="text-lg font-semibold text-slate-100 mb-1.5">Kimi K3 & Kimi K3 Pro（纯本地版）</h2>
      <p class="text-xs text-slate-400 leading-relaxed mb-4">
        不调用任何外部 API。<strong>2.6 万亿参数</strong>远超浏览器标签页显存/内存上限，因此本页面以纯本地前端模拟流式输出的方式运行，方便测试界面与交互。
      </p>
      <div class="text-[11px] text-slate-500 bg-slate-950/70 rounded-lg p-2.5 border border-slate-800/80">
        点击上方<strong>挂载本地权重</strong>或直接输入内容即可体验本地流式响应与停止按钮。
      </div>
    </div>
  </main>

  <!-- 底部输入框 -->
  <footer class="border-t border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky bottom-0">
    <div class="max-w-5xl mx-auto px-4 py-3">
      <form id="chat-form" class="flex items-end gap-2.5">
        <textarea
          id="user-input"
          rows="1"
          placeholder="在本地输入消息，按 Enter 发送（Shift + Enter 换行）..."
          class="flex-1 bg-slate-950 border border-slate-700/90 focus:border-fuchsia-500 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none resize-none max-h-36"
        ></textarea>
        <button
          type="submit"
          id="send-btn"
          class="px-4 py-2.5 rounded-xl bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium transition whitespace-nowrap"
        >
          发送
        </button>
        <button
          type="button"
          id="stop-btn"
          class="hidden px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium transition whitespace-nowrap"
        >
          停止
        </button>
      </form>
      <div class="mt-2 flex items-center justify-between text-[11px] text-slate-500">
        <span>纯本地 2.6T 测试版 · MIT License</span>
        <span>隐私 · 极简 · 浏览器本地运行</span>
      </div>
    </div>
  </footer>

  <script type="module">
    const gpuDot = document.getElementById("gpu-dot");
    const gpuText = document.getElementById("gpu-text");
    const modelSelect = document.getElementById("model-select");
    const loadBtn = document.getElementById("load-btn");
    const progressContainer = document.getElementById("progress-container");
    const progressText = document.getElementById("progress-text");
    const progressPct = document.getElementById("progress-pct");
    const progressBar = document.getElementById("progress-bar");
    const chatContainer = document.getElementById("chat-container");
    const welcomeCard = document.getElementById("welcome-card");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");
    const clearChatBtn = document.getElementById("clear-chat-btn");
    const statTtft = document.getElementById("stat-ttft");
    const statTps = document.getElementById("stat-tps");

    let isGenerating = false;
    let abortFlag = false;

    marked.setOptions({
      highlight: function (code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    async function probeLocalGpu() {
      const ramGb = navigator.deviceMemory ? `${navigator.deviceMemory}GB 内存` : "内存未知";
      if (navigator.gpu) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          const info = adapter?.info || {};
          const name = info.description || info.architecture || "WebGPU";
          gpuDot.className = "w-2 h-2 rounded-full bg-fuchsia-400";
          gpuText.textContent = `${name.slice(0, 18)} · ${ramGb}`;
          return;
        } catch (_) {}
      }
      gpuDot.className = "w-2 h-2 rounded-full bg-fuchsia-400";
      gpuText.textContent = `本地 · ${ramGb}`;
    }

    loadBtn.addEventListener("click", async () => {
      const modelName = modelSelect.value;
      loadBtn.disabled = true;
      progressContainer.classList.remove("hidden");
      progressBar.style.width = "0%";
      progressPct.textContent = "0%";

      const steps = [
        [20, `正在检查本地浏览器配额以挂载 ${modelName}（2.6T）...`],
        [55, "2.6T 权重体积远超浏览器单标签页内存上限（即使 4-bit 也需 TB 级）。"],
        [85, "已自动切换为纯本地前端空跑模式，可用于测试界面与交互。"],
        [100, `✅ ${modelName} 本地空跑模式已就绪（无网络请求）。`]
      ];

      for (const [pct, msg] of steps) {
        progressBar.style.width = `${pct}%`;
        progressPct.textContent = `${pct}%`;
        progressText.textContent = msg;
        await new Promise((r) => setTimeout(r, 220));
      }

      loadBtn.disabled = false;
      userInput.focus();
    });

    function appendMessage(role, content = "") {
      if (welcomeCard) welcomeCard.remove();

      const wrapper = document.createElement("div");
      wrapper.className = `flex ${role === "user" ? "justify-end" : "justify-start"}`;

      const bubble = document.createElement("div");
      bubble.className = role === "user"
        ? "max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-br-sm px-4 py-3 bg-fuchsia-600 text-white text-sm leading-relaxed shadow-sm"
        : "max-w-[92%] sm:max-w-[82%] rounded-2xl rounded-bl-sm px-4 py-3 bg-slate-900 border border-slate-800 text-slate-100 text-sm prose prose-invert shadow-sm";

      if (role === "user") {
        bubble.textContent = content;
      } else {
        bubble.innerHTML = content ? marked.parse(content) : '<span class="inline-block w-2 h-4 bg-fuchsia-400 animate-pulse"></span>';
      }

      wrapper.appendChild(bubble);
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    function enhanceCodeBlocks(container) {
      container.querySelectorAll("pre").forEach((pre) => {
        if (pre.querySelector(".copy-btn")) return;
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "复制";
        btn.onclick = () => {
          const code = pre.querySelector("code")?.innerText || pre.innerText;
          navigator.clipboard.writeText(code);
          btn.textContent = "已复制";
          setTimeout(() => (btn.textContent = "复制"), 1500);
        };
        pre.appendChild(btn);
      });
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      userInput.value = "";
      userInput.style.height = "auto";
      appendMessage("user", text);

      isGenerating = true;
      abortFlag = false;
      sendBtn.classList.add("hidden");
      stopBtn.classList.remove("hidden");
      userInput.disabled = true;

      const aiBubble = appendMessage("assistant", "");
      const modelName = modelSelect.value;
      const replyText =
        `**【${modelName} · 纯本地空跑】**\n\n` +
        `已收到你的输入：“${text}”\n\n` +
        `本页面未发起任何网络 API 请求。由于 **2.6T** 级别的模型无法在浏览器本地加载权重，当前由前端 JavaScript 生成流式占位回复用于界面测试。`;

      const start = performance.now();
      let current = "";

      try {
        for (let i = 0; i < replyText.length; i += 3) {
          if (abortFlag) break;
          if (i === 0) {
            statTtft.textContent = `${Math.round(performance.now() - start)}ms`;
          }
          current += replyText.slice(i, i + 3);
          aiBubble.innerHTML = marked.parse(current);
          chatContainer.scrollTop = chatContainer.scrollHeight;

          const sec = Math.max(0.05, (performance.now() - start) / 1000);
          statTps.textContent = (current.length / 3 / sec).toFixed(1);
          await new Promise((r) => setTimeout(r, 15));
        }
        enhanceCodeBlocks(aiBubble);
      } finally {
        isGenerating = false;
        stopBtn.classList.add("hidden");
        sendBtn.classList.remove("hidden");
        userInput.disabled = false;
        userInput.focus();
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      handleSend();
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 144) + "px";
    });

    stopBtn.addEventListener("click", () => {
      abortFlag = true;
    });

    clearChatBtn.addEventListener("click", () => {
      chatContainer.innerHTML = "";
      statTtft.textContent = "--";
      statTps.textContent = "--";
    });

    probeLocalGpu();
  </script>
</body>
</html>
